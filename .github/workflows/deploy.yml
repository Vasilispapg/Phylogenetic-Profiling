name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  image:
    name: build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/phyloflask:latest
            ghcr.io/${{ github.repository_owner }}/phyloflask:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: release to production
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the deploy secrets are configured
        id: guard
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::DEPLOY_HOST is not set — image published, server not touched."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an SSH session
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; trusting the key the host presents."
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Pull the new image and restart
        if: steps.guard.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/srv/phyloflask' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             docker compose -f docker-compose.prod.yml pull && \
             docker compose -f docker-compose.prod.yml up -d --remove-orphans && \
             docker image prune -f"

      # A deploy that silently breaks the site is worse than no deploy, so the
      # job only goes green once the new container answers.
      - name: Verify the site is up
        if: steps.guard.outputs.ready == 'true'
        env:
          URL: ${{ vars.DEPLOY_URL || 'https://phyloflask.vspapg.gr' }}
        run: |
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 10 "$URL/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "healthy: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 6
          done
          echo "::error::$URL/api/health did not return 200 after the deploy."
          exit 1
