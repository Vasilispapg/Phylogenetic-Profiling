{% extends "tools.html" %}

{% block content %}
<style>
    #tree-wrap { position: relative; margin-top: 16px; }
    #tree-svg { width: 100%; max-width: 900px; height: auto; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; }
    .link { fill: none; stroke: rgba(255,255,255,0.32); stroke-width: 1px; }
    .node circle { stroke: #241f3d; stroke-width: 1.5px; cursor: pointer; }
    .node text { font-size: 9px; fill: #e9e7f5; }
    #tree-tooltip { display:none; position:absolute; pointer-events:none; background:#2b2747; color:#fff; border:1px solid rgba(255,255,255,0.25); border-radius:8px; padding:6px 10px; font-size:0.8rem; line-height:1.4; z-index:5; max-width:260px; }
    .tree-ctl { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:1rem; }
    .tree-ctl label { display:flex; align-items:center; gap:8px; font-size:0.85rem; }
</style>

<section id="tree-viewer-tool" class="wrapper style1 fullscreen fade-up">
    <div class="inner">
        <h1>Phylogenetic tree viewer</h1>
        <p>Upload a Newick (<code>.nw</code>) file. Click a node to collapse/expand, hover for details,
           search a species, and colour leaves by genus.</p>

        <form id="tree-upload-form" enctype="multipart/form-data">
            <div id="tree-dropzone" class="dropzone">
                <input type="file" id="tree-file" accept=".nw,.newick,.nwk,.txt">
                <div class="dz-icon"><i class="fas fa-upload"></i></div>
                <p class="dz-title">Drop a Newick (.nw) file here</p>
                <p class="dz-hint">or click to browse</p>
            </div>
            <div id="tree-file-pill" class="file-pill" style="display:none"></div>
            <div style="margin-top:1rem">
                <button type="button" id="upload-tree-button" class="futuristic-btn"><i class="fas fa-sitemap"></i> View tree</button>
            </div>
            <div id="tree-status" class="tool-status"></div>
        </form>

        <div id="tree-viewer-result" class="d-none">
            <div class="tree-ctl">
                <label>Search
                    <input type="text" id="tree-search" class="futuristic-input" style="width:auto" placeholder="species name…">
                </label>
                <button type="button" id="tree-search-btn" class="futuristic-btn-secondary"><i class="fas fa-search"></i> Find</button>
                <label>Expand to depth
                    <input type="range" id="depth-slider" min="1" max="20" value="4">
                    <span id="depth-value">4</span>
                </label>
                <button type="button" id="expand-all" class="futuristic-btn-secondary">Expand all</button>
                <button type="button" id="collapse-all" class="futuristic-btn-secondary">Collapse</button>
            </div>
            <div id="tree-wrap">
                <svg id="tree-svg" viewBox="0 0 1000 1000"></svg>
                <div id="tree-tooltip"></div>
            </div>
        </div>
    </div>
</section>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("tree-file");
    const statusEl = document.getElementById("tree-status");
    const svg = d3.select("#tree-svg");
    const tip = document.getElementById("tree-tooltip");
    const wrap = document.getElementById("tree-wrap");
    const width = 1000, height = 1000, radius = width / 2 - 60;
    const g = svg.append("g").attr("transform", `translate(${width / 2},${height / 2})`);

    let root = null, counter = 0;

    Phylo.dropzone({ zone: document.getElementById("tree-dropzone"), input, pill: document.getElementById("tree-file-pill") });

    const genus = (name) => { const p = (name || "").split("-"); return p.length > 2 ? p[2].split("_")[0] : (name || ""); };
    function genusColor(d) {
        if (d.children || d._children) return d._children ? "#e44c65" : "#cfcaf2";
        const gn = genus(d.data.name); if (!gn) return "#9aa0c9";
        let h = 0; for (const ch of gn) h = (h * 31 + ch.charCodeAt(0)) % 360;
        return `hsl(${h},60%,62%)`;
    }

    function update() {
        d3.tree().size([2 * Math.PI, radius])(root);
        const nodes = root.descendants(), links = root.links();

        g.selectAll("path.link").data(links, d => d.target.id).join("path")
            .attr("class", "link")
            .attr("d", d3.linkRadial().angle(d => d.x).radius(d => d.y));

        const node = g.selectAll("g.node").data(nodes, d => d.id).join(enter => {
            const ge = enter.append("g").attr("class", "node");
            ge.append("circle");
            ge.append("text");
            return ge;
        });

        node.attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`);
        node.select("circle")
            .attr("r", d => d._children ? 6 : 4)
            .attr("fill", genusColor);
        node.select("text")
            .attr("dy", "0.32em")
            .attr("x", d => (d.x < Math.PI) === !d.children ? 8 : -8)
            .style("text-anchor", d => (d.x < Math.PI) === !d.children ? "start" : "end")
            .attr("transform", d => d.x >= Math.PI ? "rotate(180)" : null)
            .text(d => (d.data.name && d.data.name !== "Unnamed") ? d.data.name : "");

        node.on("click", (e, d) => {
            if (d.children) { d._children = d.children; d.children = null; }
            else if (d._children) { d.children = d._children; d._children = null; }
            update();
        }).on("mouseover", (e, d) => {
            const n = (d.descendants().length - 1);
            tip.innerHTML = `<strong>${d.data.name && d.data.name !== "Unnamed" ? d.data.name : "(internal node)"}</strong><br>` +
                ((d.children || d._children) ? `${n} descendants` : "leaf");
            tip.style.display = "block";
        }).on("mousemove", (e) => {
            const [x, y] = d3.pointer(e, wrap);
            tip.style.left = (x + 14) + "px"; tip.style.top = (y + 10) + "px";
        }).on("mouseout", () => { tip.style.display = "none"; });
    }

    function expandAll(d) { if (d._children) { d.children = d._children; d._children = null; } (d.children || []).forEach(expandAll); }
    function collapseBelow(d, depth) { if (d.depth >= depth && d.children) { d._children = d.children; d.children = null; } else (d.children || []).forEach(c => collapseBelow(c, depth)); }
    function expandToDepth(n) { expandAll(root); collapseBelow(root, n); update(); }

    function load(treeData) {
        g.selectAll("*").remove();
        root = d3.hierarchy(treeData);
        counter = 0; root.each(d => d.id = ++counter);
        document.getElementById("tree-viewer-result").classList.remove("d-none");
        expandToDepth(parseInt(document.getElementById("depth-slider").value, 10));
    }

    // Controls
    const depthSlider = document.getElementById("depth-slider");
    depthSlider.addEventListener("input", () => {
        document.getElementById("depth-value").textContent = depthSlider.value;
        if (root) expandToDepth(parseInt(depthSlider.value, 10));
    });
    document.getElementById("expand-all").addEventListener("click", () => { if (root) { expandAll(root); update(); } });
    document.getElementById("collapse-all").addEventListener("click", () => { if (root) expandToDepth(1); });

    document.getElementById("tree-search-btn").addEventListener("click", () => {
        const q = document.getElementById("tree-search").value.trim().toLowerCase();
        if (!root || !q) return;
        let target = null;
        root.each(d => { if (!target && d.data.name && d.data.name.toLowerCase().includes(q)) target = d; });
        if (!target) { Phylo.status(statusEl, "No species matches “" + q + "”.", "error"); return; }
        Phylo.clearStatus(statusEl);
        target.ancestors().forEach(a => { if (a._children) { a.children = a._children; a._children = null; } });
        update();
        const onPath = new Set(target.ancestors().map(a => a.id));
        g.selectAll("path.link").attr("stroke", d => onPath.has(d.target.id) ? "#e44c65" : null)
            .attr("stroke-width", d => onPath.has(d.target.id) ? 2.5 : null);
        g.selectAll("g.node circle").attr("stroke", d => d === target ? "#fff" : null)
            .attr("stroke-width", d => d === target ? 3 : null);
    });

    // Zoom / pan
    svg.call(d3.zoom().scaleExtent([0.4, 4]).on("zoom", (e) => g.attr("transform", e.transform)));

    // Upload
    document.getElementById("upload-tree-button").addEventListener("click", async () => {
        const file = input.files[0];
        if (!file) { Phylo.status(statusEl, "Please choose a .nw file.", "error"); return; }
        Phylo.status(statusEl, "Processing tree…", "info", true);
        try {
            const res = await Phylo.upload("/tools/tree_viewer", file);
            if (res.status === "success") {
                load(res.tree_data);
                depthSlider.max = Math.max(4, res.max_depth_tree || 12);
                Phylo.status(statusEl, '<i class="fas fa-check"></i> Tree loaded — click nodes to expand/collapse.', "success");
            } else {
                Phylo.status(statusEl, res.message || "Failed to load tree.", "error");
            }
        } catch (e) {
            Phylo.status(statusEl, "An error occurred while processing the tree.", "error");
            console.error(e);
        }
    });
});
</script>
{% endblock %}
