{% extends "tools.html" %}

{% block content %}
<style>
    #loading-spinner {
        display: none;
        margin: 20px auto;
        border: 8px solid #f3f3f3;
        border-top: 8px solid #3498db;
        border-radius: 50%;
        position: absolute;
        top: 45%;
        left: 45%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    #allvsall-container {
        display: none;
    }

    .search-bubble {
        display: inline-block;
        background-color: #3498db;
        color: #fff;
        padding: 5px 10px;
        border-radius: 15px;
        margin-right: 5px;
        margin-bottom: 5px;
        font-size: 14px;
        cursor: default;
    }

    .search-bubble .remove-bubble {
        margin-left: 8px;
        font-size: 14px;
        cursor: pointer;
        color: #fff;
    }

    .hidden {
        display: none !important;
    }

    #search-node {
        margin-bottom: 10px;
        width: 100%;
        padding: 8px;
    }

    #search-bubbles {
        margin-bottom: 10px;
    }
</style>

<section id="allvsall-tool" class="wrapper style1 fullscreen fade-up">
    <div class="inner">
        <h1>All Vs All Analysis Tool</h1>
        <p>Generate interactive all-vs-all correlation graph for your datasets.</p>

        <!-- Upload Form -->
        <form id="allvsall-upload-form">
            <label for="allvsall-file" class="form-label">Upload Dataset:</label>
            <input type="file" id="allvsall-file" name="file" class="form-control futuristic-input" required>
            <button type="submit" class="button mt-3">Generate graph</button>
            <div id="allvsall-message" class="text-info mt-2"></div>
        </form>

        <!-- allvsall & Graph Visualization -->
        <div id="allvsall-container">
            <button id="back-button" class="button mt-3">Back</button>
            <div id="search-bubbles"></div>
            <input
                type="text"
                id="search-node"
                list="node-options"
                class="form-control"
                placeholder="Search and highlight nodes..."
            />
            <datalist id="node-options"></datalist>
            <button id="reset-zoom" class="button mt-3">Reset Zoom</button>
            <div id="graph" style="width: 100%; height: 600px; border: 1px solid #ccc;"></div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading-spinner"></div>
    </div>
</section>

<script>
    const form = document.getElementById("allvsall-upload-form");
    const allvsallContainer = document.getElementById("allvsall-container");
    const backButton = document.getElementById("back-button");
    const messageDiv = document.getElementById("allvsall-message");
    const searchNode = document.getElementById("search-node");
    const datalist = document.getElementById("node-options");
    const searchBubbles = document.getElementById("search-bubbles");

    let originalNodes = []; // Global variable to store original nodes
    let originalEdges = []; // Store original edges for reset functionality
    let originalPositions = {}; // Store positions of nodes for reset functionality

    // Map to store all node connections
    const connectionMap = new Map();

    let cy; // Cytoscape instance
    let highlightedNodes = {}; // To track highlighted nodes with unique colors

    backButton.addEventListener("click", () => {
        allvsallContainer.style.display = "none";
        form.style.display = "block";
    });

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        const fileInput = document.getElementById("allvsall-file");
        const file = fileInput.files[0];

        if (!file) {
            messageDiv.textContent = "Please select a file.";
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        fetch("/tools/allvsall", {
            method: "POST",
            body: formData,
        })
            .then((response) => response.json())
            .then((data) => {
                if (data.status === "success") {
                    messageDiv.textContent = data.message;
                    pollForResults(data.filename);
                } else {
                    messageDiv.textContent = data.message;
                }
            })
            .catch((error) => {
                messageDiv.textContent = "Error uploading file.";
                console.error(error);
            });
    });

    function pollForResults(filename) {
        const interval = setInterval(async () => {
            try {
                const response = await fetch(`/allvsall_status/${filename}`);
                const data = await response.json();

                if (data.status === "success" && data.message === "Completed.") {
                    clearInterval(interval);
                    fetchallvsallData(filename);
                } else if (data.status === "error") {
                    clearInterval(interval);
                    messageDiv.textContent = data.message;
                } else {
                    messageDiv.textContent = data.message;
                }
            } catch (error) {
                clearInterval(interval);
                messageDiv.textContent = "Error checking status.";
                console.error(error);
            }
        }, 2000);
    }

    async function fetchallvsallData(filename) {
        try {
            document.getElementById("loading-spinner").style.display = "block";

            const response = await fetch(`/allvsall_data/${filename}`);
            const data = await response.json();

            if (data.status === "success") {
                renderGraph(data.edges, data.positions, data.nodes);
                form.style.display = "none";
                allvsallContainer.style.display = "block";
            } else {
                messageDiv.textContent = data.message;
            }
        } catch (error) {
            messageDiv.textContent = "Error fetching allvsall data.";
            console.error(error);
        } finally {
            document.getElementById("loading-spinner").style.display = "none";
        }
    }
    
    function renderGraph(edges, positions, nodes) {
        originalNodes = [...nodes]; // Copy the nodes array to `originalNodes`
        originalEdges = [...edges]; // Copy the edges array to `originalEdges`
        originalPositions = { ...positions }; // Save positions for resetting graph

        // Initialize Cytoscape.js
        cy = cytoscape({
            container: document.getElementById("graph"),
            elements: [
                ...nodes.map((node) => ({
                    data: { id: node },
                    position: {
                        x: positions[node][0] * 600,
                        y: positions[node][1] * 600,
                    },
                })),
                ...edges.map((edge) => ({
                    data: { source: edge.source, target: edge.target },
                })),
            ],
            style: [
                {
                    selector: "node",
                    style: {
                        "background-color": "#3498db",
                        label: "data(id)",
                        "font-size": "10px",
                        color: "#fff",
                        "text-halign": "center",
                        "text-valign": "center",
                    },
                },
                {
                    selector: "edge",
                    style: {
                        "line-color": "#2ecc71",
                        width: 1.5,
                    },
                },
            ],
            layout: { name: "preset" },
            zoom: 1,
            minZoom: 0.5,
            maxZoom: 2,
        });

        nodes.forEach((node) => {
            const option = document.createElement("option");
            option.value = node;
            datalist.appendChild(option);
        });
        

        // Populate connectionMap
        edges.forEach((edge) => {
            if (!connectionMap.has(edge.source)) {
                connectionMap.set(edge.source, { nodes: new Set(), edges: new Set() });
            }
            if (!connectionMap.has(edge.target)) {
                connectionMap.set(edge.target, { nodes: new Set(), edges: new Set() });
            }
            connectionMap.get(edge.source).nodes.add(edge.target);
            connectionMap.get(edge.source).edges.add(edge);
            connectionMap.get(edge.target).nodes.add(edge.source);
            connectionMap.get(edge.target).edges.add(edge);
        });

        searchNode.addEventListener("keydown", (event) => {
            // if is enter key
           if(event.key !== "Enter" && event.keyCode !== 13){
               return;
           }
            const query = event.target.value.trim();

            if (!query || highlightedNodes[query]) return;

            let node = cy.$id(query); // Get the Cytoscape node
            let isNewNode = false;

            if (node.length === 0) {

                 // Check if the node exists in the original graph
                const nodeExistsInFullGraph = originalNodes.includes(query);

                if (!nodeExistsInFullGraph) {
                    console.log(`Node "${query}" not found in the full graph. Cannot create bubble.`);
                    alert(`Node "${query}" does not exist in the full graph.`);
                    return; // Exit if the node doesn't exist in the full graph
                }

                // Node not found, create it
                console.log(`Node "${query}" not found. Creating a new bubble.`);
                const newNodePosition = {
                    x: Math.random() * 1000, // Randomized position for the new bubble
                    y: Math.random() * 1000,
                };

                cy.add({
                    data: { id: query },
                    position: newNodePosition,
                });

                node = cy.getElementById(query); // Get the newly added node
                isNewNode = true;
            }

            const defaultNodeColor = "#3498db";

            // Fetch connections from the connectionMap
            const connections = connectionMap.get(query) || { nodes: new Set(), edges: new Set() };
            const connectedNodes = Array.from(connections.nodes); // Assume these are plain strings
            const connectedEdges = Array.from(connections.edges); // Assume these are plain objects with source/target

            // Debugging logs
            console.log("Query:", query);
            console.log("Connections:", connections);
            console.log("Connected Nodes (processed):", connectedNodes);
            console.log("Connected Edges (processed):", connectedEdges);

            // Add connected nodes to the graph
            connectedNodes.forEach((nodeId, index) => {
                if (!cy.hasElementWithId(nodeId)) {
                    console.log("Adding node:", nodeId);

                    if (typeof nodeId === "string" && nodeId.trim().length > 0) {
                        // Calculate a position offset for the new bubble
                        const bubbleOffset = 650; // Fixed distance to separate bubbles
                        const bubbleAngle = isNewNode
                            ? Math.random() * 2 * Math.PI // Random angle for the bubble if new
                            : Object.keys(highlightedNodes).length * Math.PI / 3; // Unique angle for existing bubbles

                        const baseBubblePosition = {
                            x: node.position().x + bubbleOffset * Math.cos(bubbleAngle),
                            y: node.position().y + bubbleOffset * Math.sin(bubbleAngle),
                        };

                        // Calculate the position of each node in the bubble
                        const angle = (index / connectedNodes.length) * 2 * Math.PI; // Spread nodes in a circle
                        const newNodePosition = {
                            x: baseBubblePosition.x + 100 * Math.cos(angle), // Offset within the bubble
                            y: baseBubblePosition.y + 100 * Math.sin(angle),
                        };

                        // Add the node to the graph
                        cy.add({
                            data: { id: nodeId },
                            position: newNodePosition,
                        });
                    } else {
                        console.error("Invalid node ID:", nodeId);
                    }
                }
            });

            // Add connected edges to the graph
            connectedEdges.forEach((e) => {
                const edgeSource = e.source; // Extract source directly
                const edgeTarget = e.target; // Extract target directly
                const edgeId = `${edgeSource}-${edgeTarget}`;

                if (!cy.hasElementWithId(edgeId)) {
                    console.log("Adding edge:", edgeId, edgeSource, edgeTarget);

                    if (typeof edgeSource === "string" && typeof edgeTarget === "string") {
                        cy.add({ data: { id: edgeId, source: edgeSource, target: edgeTarget } }); // Add edge directly
                    } else {
                        console.error("Invalid edge data:", e);
                    }
                }
            });

            // Style the current master node and its connections
            const color = getValidColor();
            node.style("background-color", color);

            // Style connected nodes
            connectedNodes.forEach((nodeId) => {
                const cyNode = cy.getElementById(nodeId); // Convert node ID to Cytoscape.js element
                if (cyNode.length > 0) {
                    cyNode.style("background-color", lightenColor(color, 20)); // Style the node
                } else {
                    console.error(`Node "${nodeId}" not found in the graph.`);
                }
            });

            // Style connected edges
            connectedEdges.forEach((edge) => {
                if (edge && edge.source && edge.target) {
                    const edgeId = `${edge.source}-${edge.target}`;
                    const cyEdge = cy.edges(`[id="${edgeId}"]`);
                    if (cyEdge.length > 0) {
                        cyEdge.style("line-color", lightenColor(color, 40)); // Style the edge
                    } else {
                        console.error(`Edge "${edgeId}" not found in the graph.`);
                    }
                } else {
                    console.error("Invalid edge data:", edge);
                }
            });

            // Save highlighted elements for this master node
            highlightedNodes[query] = {
                nodes: new Set(connectedNodes),
                edges: new Set(connectedEdges.map((e) => `${e.source}-${e.target}`)),
                color,
            };

            // Create a bubble for the current node
            addBubble(query, color);

            // Clear the input field
            searchNode.value = "";
        });

        document.getElementById("reset-zoom").addEventListener("click", () => cy.reset());
    }

    function removeNodesWithDefaultColors() {
        // Define the default colors for nodes and edges
        const defaultNodeColor = "#3498db"; // Replace with your actual default node color
        const defaultEdgeColor = "#2ecc71"; // Replace with your actual default edge color

        // Helper function to convert RGB to Hex
        function rgbToHex(rgb) {
            const match = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
            if (!match) return rgb; // Return the original color if it's not in RGB format

            const r = parseInt(match[1]).toString(16).padStart(2, "0");
            const g = parseInt(match[2]).toString(16).padStart(2, "0");
            const b = parseInt(match[3]).toString(16).padStart(2, "0");

            return `#${r}${g}${b}`;
        }

        // Collect nodes to be removed
        const nodesToRemove = [];

        cy.nodes().forEach(node => {
            const nodeColor = rgbToHex(node.style("background-color"));
            const connectedEdges = node.connectedEdges();
            // Check if the node has the default color and all connected edges are default-colored
            const allEdgesDefaultColor = connectedEdges.every(edge => {
                const edgeColor = rgbToHex(edge.style("line-color"));
                return edgeColor === defaultEdgeColor;
            });

            if (nodeColor === defaultNodeColor && allEdgesDefaultColor) {
                nodesToRemove.push(node); // Mark the node for removal
            }
        });

        // Remove marked nodes and their connected edges
        nodesToRemove.forEach(node => {
            // console.log(`Removing node: ${node.id()}`);
            node.connectedEdges().remove(); // Remove all edges connected to the node
            node.remove(); // Remove the node itself
        });

        // Remove edges with the default color that are not connected to any nodes
        cy.edges().forEach(edge => {
            const edgeColor = rgbToHex(edge.style("line-color"));
            const connectedNodes = edge.connectedNodes();

            if (edgeColor === defaultEdgeColor && connectedNodes.length === 0) {
                // console.log(`Removing edge: ${edge.id()}`);
                edge.remove();
            }
        });
    }

    function addBubble(query, color) {
            // Create the bubble container
            const colorPickerId = `color-picker-${query}`;


            const bubble = document.createElement("span");
            bubble.className = "search-bubble";
            bubble.textContent = query;

            // Style the bubble with the unique color
            bubble.style.backgroundColor = color;
            removeNodesWithDefaultColors();


            // Create the color picker for dynamic color change
            const colorPicker = document.createElement("input");
            colorPicker.type = "color";
            colorPicker.id = colorPickerId;
            colorPicker.value = color;
            colorPicker.style.marginLeft = "10px";
            colorPicker.style.cursor = "pointer";

            // Add color change event listener
            colorPicker.addEventListener("input", (event) => {
                const newColor = event.target.value;

                // Update the bubble color
                bubble.style.backgroundColor = newColor;

                // Update the color of associated nodes and edges
                const bubbleData = highlightedNodes[query];
                if (bubbleData) {
                    // Update the master node color
                    const masterNode = cy.getElementById(query);
                    if (masterNode.length > 0) {
                        masterNode.style("background-color", newColor); // Change master node color
                    }

                    // Update all associated nodes
                    bubbleData.nodes.forEach((nodeId) => {
                        const cyNode = cy.getElementById(nodeId);
                        cyNode.style("background-color", lightenColor(newColor, 20));
                    });

                    // Update all edges connected to the nodes in the bubble
                    bubbleData.nodes.forEach((nodeId) => {
                        const cyNode = cy.getElementById(nodeId);
                        cyNode.connectedEdges().forEach((cyEdge) => {
                            cyEdge.style("line-color", lightenColor(newColor, 40));
                        });
                    });
                }
            });





            // Create the remove button
            const removeButton = document.createElement("span");
            removeButton.className = "remove-bubble";
            removeButton.textContent = " X";

           // Define behavior when the bubble is removed
            removeButton.onclick = () => {
                // Remove the highlighted nodes and edges for this bubble
                if (highlightedNodes[query]) {
                    const bubbleData = highlightedNodes[query];

                    // Remove nodes unique to this bubble that have only one connected edge
                    bubbleData.nodes.forEach(nodeId => {
                        const cyNode = cy.$id(nodeId);
                        const connectedEdges = cyNode.connectedEdges();

                        // Check if the node is shared in other bubbles
                        const isNodeShared = Object.values(highlightedNodes).some(
                            b => b !== bubbleData && b.nodes.has(nodeId)
                        );

                        // Remove the node if it's not shared and has only one edge
                        if (!isNodeShared && connectedEdges.length === 1) {
                            connectedEdges.remove(); // Remove the edge
                            cyNode.remove(); // Remove the node
                        }
                    });

                    // Remove edges unique to this bubble
                    bubbleData.edges.forEach(edgeId => {
                        const cyEdge = cy.$id(edgeId);

                        // Check if the edge is shared in other bubbles
                        const isEdgeShared = Object.values(highlightedNodes).some(
                            b => b !== bubbleData && b.edges.has(edgeId)
                        );

                        // Remove the edge if it's not shared
                        if (!isEdgeShared) {
                            cyEdge.remove();
                        }
                    });

                    // Delete the bubble data
                    delete highlightedNodes[query];
                }

            // Remove the bubble from the DOM
            bubble.remove();

            // Reset graph when no bubbles remain
            if (Object.keys(highlightedNodes).length === 0) {

                cy.elements().remove(); // Clear the graph

                // Re-add the original nodes
                originalNodes.forEach((node) => {
                    if (originalPositions[node]) {
                        cy.add({
                            data: { id: node },
                            position: {
                                x: originalPositions[node][0] * 600,
                                y: originalPositions[node][1] * 600,
                            },
                        });
                    } else {
                        console.warn(`Position for node "${node}" not found.`);
                    }
                });


                // Re-add the original edges
                originalEdges.forEach((edge) => {
                    if (originalNodes.includes(edge.source) && originalNodes.includes(edge.target)) {
                        cy.add({
                            data: { source: edge.source, target: edge.target },
                        });
                    } else {
                        console.warn(`Cannot create edge with source "${edge.source}" and target "${edge.target}" as one or both nodes are missing.`);
                    }
                });


                // Reapply the layout
                cy.layout({ name: "preset" }).run();
            }
        };

            // Add the remove button to the bubble
            bubble.appendChild(colorPicker);
            bubble.appendChild(removeButton);

            // Append the bubble to the container
            searchBubbles.appendChild(bubble);
        }

    function mayResetGraph(edges,positions,nodes,highlightedNodes){
        if(Object.keys(highlightedNodes).length === 0){
            // Reset the graph to the original state
            document.getElementById("loading-spinner").style.display = "block";
            cy.elements().remove();
            cy.add(nodes.map((node) => ({
                data: { id: node },
                position: {
                    x: positions[node][0] * 600,
                    y: positions[node][1] * 600,
                },
            })));
            cy.add(edges.map((edge) => ({
                data: { source: edge.source, target: edge.target },
            })));

            cy.layout({ name: "preset" }).run();
            document.getElementById("loading-spinner").style.display = "none";
        }
    }

    function getValidColor() {
        let color = `#${Math.floor(Math.random() * 16777215).toString(16)}`;
        while (color.length < 7) {
            color = `#0${color.slice(1)}`; // Pad with zeros if necessary
        }
        return color;
    }

    function getRandomColor() {
        return `#${Math.floor(Math.random() * 16777215).toString(16)}`;
    }

    function lightenColor(color, percent) {
        const num = parseInt(color.slice(1), 16);
        const amt = Math.round(2.55 * percent);
        const r = (num >> 16) + amt;
        const g = ((num >> 8) & 0x00ff) + amt;
        const b = (num & 0x0000ff) + amt;

        return `#${(
            0x1000000 +
            (r < 255 ? (r < 0 ? 0 : r) : 255) * 0x10000 +
            (g < 255 ? (g < 0 ? 0 : g) : 255) * 0x100 +
            (b < 255 ? (b < 0 ? 0 : b) : 255)
        )
            .toString(16)
            .slice(1)}`;
    }
</script>
{% endblock %}
