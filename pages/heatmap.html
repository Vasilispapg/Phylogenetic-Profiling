{% extends "tools.html" %}

{% block content %}

    <style>
        #loading-spinner { 
            display: none;
            margin: 20px auto;
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            position: absolute;
            top: 45%;
            left: 45%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #heatmap-container { display: none; }
        .highlighted {
            font-weight: bold;
            background-color: #f39c12 !important;
        }
        #search-node {
            margin-bottom: 10px;
            width: 100%;
            padding: 8px;
        }
    </style>

    <section id="heatmap-tool" class="wrapper style1 fullscreen fade-up">
        <div class="inner">
            <h1>Heatmap Analysis Tool</h1>
            <p>Generate interactive all-vs-all correlation heatmaps for your datasets.</p>

            <!-- Upload Form -->
            <form id="heatmap-upload-form">
                <label for="heatmap-file" class="form-label">Upload Dataset:</label>
                <input type="file" id="heatmap-file" name="file" class="form-control futuristic-input" required>
                <button type="submit" class="button mt-3">Generate Heatmap</button>
                <div id="heatmap-message" class="text-info mt-2"></div>
            </form>

            <!-- Heatmap & Graph Visualization -->
            <div id="heatmap-container">
                <button id="back-button" class="button mt-3">Back</button>
                <input
                    type="text"
                    id="search-node"
                    list="node-options"
                    class="form-control"
                    placeholder="Search and highlight nodes... (comma-separated)"
                />
                <datalist id="node-options"></datalist>
                <button id="reset-zoom" class="button mt-3">Reset Zoom</button>
                <div id="graph" style="width: 100%; height: 600px; border: 1px solid #ccc;"></div>
            </div>

            <!-- Loading Spinner -->
            <div id="loading-spinner"></div>
        </div>
    </section>

    <script>
        const form = document.getElementById("heatmap-upload-form");
        const heatmapContainer = document.getElementById("heatmap-container");
        const backButton = document.getElementById("back-button");
        const messageDiv = document.getElementById("heatmap-message");
        const searchNode = document.getElementById("search-node");
        const datalist = document.getElementById("node-options");

        let cy; // Cytoscape instance

        // Back Button Functionality
        backButton.addEventListener("click", () => {
            heatmapContainer.style.display = "none";
            form.style.display = "block";
        });

        // Submit Form
        form.addEventListener("submit", function (event) {
            event.preventDefault();
            const fileInput = document.getElementById("heatmap-file");
            const file = fileInput.files[0];

            if (!file) {
                messageDiv.textContent = "Please select a file.";
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            fetch("/tools/heatmap", {
                method: "POST",
                body: formData,
            })
                .then((response) => response.json())
                .then((data) => {
                    if (data.status === "success") {
                        messageDiv.textContent = data.message;
                        pollForResults(data.filename);
                    } else {
                        messageDiv.textContent = data.message;
                    }
                })
                .catch((error) => {
                    messageDiv.textContent = "Error uploading file.";
                    console.error(error);
                });
        });

        function pollForResults(filename) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/heatmap_status/${filename}`);
                    const data = await response.json();

                    if (data.status === "success" && data.message === "Completed.") {
                        clearInterval(interval);
                        fetchHeatmapData(filename);
                    } else if (data.status === "error") {
                        clearInterval(interval);
                        messageDiv.textContent = data.message;
                    } else {
                        messageDiv.textContent = data.message;
                    }
                } catch (error) {
                    clearInterval(interval);
                    messageDiv.textContent = "Error checking status.";
                    console.error(error);
                }
            }, 2000);
        }

        async function fetchHeatmapData(filename) {
            try {
                document.getElementById("loading-spinner").style.display = "block";

                const response = await fetch(`/heatmap_data/${filename}`);
                const data = await response.json();

                if (data.status === "success") {
                    renderGraph(data.edges, data.positions, data.nodes);
                    form.style.display = "none";
                    heatmapContainer.style.display = "block";
                } else {
                    messageDiv.textContent = data.message;
                }
            } catch (error) {
                messageDiv.textContent = "Error fetching heatmap data.";
                console.error(error);
            } finally {
                document.getElementById("loading-spinner").style.display = "none";
            }
        }

        function renderGraph(edges, positions, nodes) {
            cy = cytoscape({
                container: document.getElementById("graph"),
                elements: [
                    ...nodes.map((node) => ({
                        data: { id: node },
                        position: {
                            x: positions[node][0] * 600,
                            y: positions[node][1] * 600,
                        },
                    })),
                    ...edges.map((edge) => ({
                        data: { source: edge.source, target: edge.target },
                    })),
                ],
                style: [
                    {
                        selector: "node",
                        style: {
                            "background-color": "#3498db",
                            label: "data(id)",
                            "font-size": "10px",
                            color: "#fff",
                            "text-halign": "center",
                            "text-valign": "center",
                        },
                    },
                    {
                        selector: "edge",
                        style: {
                            "line-color": "#2ecc71",
                            width: 1.5,
                        },
                    },
                ],
                layout: { name: "preset" },
                zoom: 1,
                minZoom: 0.5,
                maxZoom: 2,
            });

            // Populate the datalist for node search
            nodes.forEach((node) => {
                const option = document.createElement("option");
                option.value = node;
                datalist.appendChild(option);
            });

            // Add search functionality
            searchNode.addEventListener("input", (event) => {
                const query = event.target.value.split(",").map((q) => q.trim());

                cy.elements().removeClass("highlighted hidden");

                if (query.length > 0 && query[0] !== "") {
                    cy.elements().addClass("hidden");
                    query.forEach((q) => {
                        const node = cy.$id(q);
                        if (node.length > 0) {
                            node.removeClass("hidden").addClass("highlighted");
                            node.connectedEdges().removeClass("hidden").addClass("highlighted");
                            node.connectedEdges().connectedNodes().removeClass("hidden");
                        }
                    });
                }
            });

            // Add styles for highlighted elements
            cy.style()
                .selector(".highlighted")
                .style({
                    "background-color": "#f39c12",
                    "line-color": "#f39c12",
                    "transition-property": "background-color, line-color",
                    "transition-duration": "0.3s",
                })
                .selector(".hidden")
                .style({
                    display: "none",
                })
                .update();

            // Reset Zoom
            document.getElementById("reset-zoom").addEventListener("click", () => cy.reset());
        }
    </script>

{% endblock %}
