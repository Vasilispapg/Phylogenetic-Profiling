<!DOCTYPE HTML>
<html>
<head>
    <title>PhyloFlask</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/main.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/fontawesome-all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/tools.css') }}">
    <noscript><link rel="stylesheet" href="{{ url_for('static', filename='assets/css/noscript.css') }}"></noscript>
    <script src="{{ url_for('static', filename='assets/js/tools.js') }}"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

</head>
<body class="is-preload">

    <!-- Sidebar -->
    <section id="sidebar">
        <div class="inner">
            <a href="/" class="brand"><i class="fas fa-dna"></i> PhyloFlask</a>
            <nav>
                <ul>
                    <li><a style="font-size:0.8rem" href="/">Home</a></li>
                    <li><a style="font-size:0.8rem" href="{{ url_for('blast_tool') }}">BLAST Analysis</a></li>
                    <li><a style="font-size:0.8rem" href="{{ url_for('heatmap.heatmap_tool') }}">Heatmap Analysis</a></li>
                    <li><a style="font-size:0.8rem" href="{{ url_for('allvsall.allvsall_tool') }}">All vs All Analysis</a></li>
                    <li><a style="font-size:0.8rem" href="{{ url_for('tree.tree_viewer_tool') }}">Tree viewer</a></li>
                    <li><a style="font-size:0.8rem" href="{{ url_for('tree.tree_construct_tool') }}">Tree builder</a></li>
                    <li><a style="font-size:0.8rem" href="{{ url_for('how_to') }}">How to use</a></li>
                    <li><a style="font-size:0.8rem" href="{{ url_for('faq') }}">FAQ</a></li>
                </ul>
            </nav>
        </div>
    </section>

    <!-- Wrapper -->
    <div id="wrapper">
        <div id="tool-content">
            {% block content %}
            <!-- This block will be replaced dynamically -->
            {% endblock %}
        </div>
    </div>

    <!-- Footer -->
    <footer id="footer" class="wrapper style1-alt">
        <div class="inner">
            <ul class="menu">
                <li>&copy; PhyloFlask &middot; BCCB Group, AUTH</li>
                <li><a href="{{ url_for('faq') }}">FAQ</a> &middot; <a href="{{ url_for('how_to') }}">How to use</a></li>
            </ul>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='assets/js/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/js/jquery.scrollex.min.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/js/jquery.scrolly.min.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/js/browser.min.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/js/breakpoints.min.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/js/util.js') }}"></script>
    <script src="{{ url_for('static', filename='assets/js/main.js') }}"></script>

    <script>
        // make active link the li of current page
        $(document).ready(function() {
            var path = window.location.pathname;
            path = path.replace(/\/$/, "");
            path = decodeURIComponent(path);

            $(".inner nav ul li a").each(function() {
                var href = $(this).attr('href');
                if (path === href) {
                    $(this).addClass('active');
                }
            });
        });
    </script>


</body>
</html>
