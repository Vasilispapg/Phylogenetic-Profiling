services:
  web:
    build: .
    ports:
      # Host 8000 -> container 8000 (host 5000 is taken by AirPlay on macOS).
      - "8000:8000"
    environment:
      # Set to 1 only for local debugging (never in production).
      - FLASK_DEBUG=0
      - MAX_UPLOAD_MB=200
    volumes:
      # Persist uploaded and generated files on the host.
      - ./uploads:/app/uploads
      - ./downloads:/app/downloads
      - ./cache:/app/cache
    restart: unless-stopped
