services:
  web:
    build: .
    ports:
      # Host 8000 -> container 8000 (host 5000 is taken by AirPlay on macOS).
      - "8000:8000"
    environment:
      # Set to 1 only for local debugging (never in production).
      - FLASK_DEBUG=0
      - MAX_UPLOAD_MB=200
      # How many jobs may run concurrently, and how long results are kept.
      - JOB_WORKERS=2
      - JOB_TTL_SECONDS=86400
      # Job database and result blobs live under one mounted directory: binding
      # a single file that does not exist yet would make Docker create a folder.
      - DB_PATH=/app/state/jobs.sqlite
      - RESULT_DIR=/app/state/results
    volumes:
      - ./uploads:/app/uploads
      - ./downloads:/app/downloads
      - ./cache:/app/cache
      - ./state:/app/state
    restart: unless-stopped
